# This file contains the parameters that are needed to use sentry-kube
# for each silo-region (region or single tenant).
#
# Optional: override the published sentry-options-automator repos.json URL
# that `sentry-kube options set` falls back to when no local repos.json is
# found. Defaults to the getsentry/sentry-options-automator main branch.
# options_automator_repos_config_url: https://example.invalid/repos.json
silo_regions:
  saas:
    aliases: [saasalias]
    k8s:
      root: k8s
      cluster_def_root: clusters/us
      materialized_manifests: materialized_manifests/us
    sentry_region: us
    stage: production  # defaults to "production" if not specified
    service_monitors: { getsentry: [123456789] }
