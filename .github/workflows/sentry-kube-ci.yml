name: CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    name: "Run tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Make environment
        run: |
          uv pip install --system -r requirements-dev.txt -r requirements.txt

      - name: Install kube-linter
        # Needed for the kube-linter integration tests.
        # Download the prebuilt release binary instead of compiling it with
        # `go install`, which took ~2 minutes.
        env:
          KUBE_LINTER_VERSION: v0.7.3
          KUBE_LINTER_SHA256: 871594f14ca75865014d6ab554b2b8be597b513196e08310e1fef956e5f4f4da
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kube-linter.tar.gz" \
            "https://github.com/stackrox/kube-linter/releases/download/${KUBE_LINTER_VERSION}/kube-linter-linux.tar.gz"
          echo "${KUBE_LINTER_SHA256}  $RUNNER_TEMP/kube-linter.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/kube-linter.tar.gz" -C /usr/local/bin kube-linter
          kube-linter version

      - name: Run sentry-kube tests
        run: |
          make tools-test
